<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add User</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #111111;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            padding: 50px 20px;
        }

        /* ---------------- FORM ---------------- */

        .form-container {
            width: 330px;
            margin: 0 auto 30px auto;
            padding: 22px 20px;
            background-color: #292929;
            border: 1px solid #444;
            border-radius: 12px;
        }

        .form-container h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background-color: #414141;
            border: none;
            outline: none;
            color: white;
            border-radius: 5px;
            padding: 8px;
            font-size: 14px;
        }

        .form-group input {
            height: 28px;
        }

        .form-group textarea {
            height: 58px;
            resize: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: 1px solid #666;
        }

        .submit-btn {
            width: 100%;
            height: 34px;
            background-color: #292929;
            color: white;
            background-color: red;
            border: 1px solid #333;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        .submit-btn:hover {
            background-color: #353535;
        }

        /* ---------------- CARDS ---------------- */

        .cards-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
            flex-wrap: wrap;
        }

        .user-card {
            width: 220px;
            min-height: 205px;
            background-color: #292929;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 22px 15px;
            text-align: center;
        }

        .user-image {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #555;
            margin-bottom: 10px;
        }

        .user-card h2 {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .user-card .role {
            font-size: 12px;
            margin-bottom: 12px;
        }

        .user-card .bio {
            font-size: 11px;
            line-height: 1.5;
            color: #eeeeee;
        }

        .remove-btn {
            width: 70%;
            height: 34px;
            margin-top: 10px;
            background-color: #292929;
            color: white;
            background-color: red;
            border: 1px solid #333;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        /* ---------------- RESPONSIVE ---------------- */

        @media (max-width: 750px) {
            .cards-container {
                gap: 15px;
            }

            .user-card {
                width: 220px;
            }
        }

        @media (max-width: 500px) {
            .form-container {
                width: 100%;
                max-width: 330px;
            }

            .user-card {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- Add User Form -->

    <div class="form-container">

        <h1>Add User</h1>

        <form>

            <div class="form-group">
                <label for="name" >Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <input
                    type="text"
                    id="role"
                    name="role"
                    required
                >
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea
                    id="bio"
                    name="bio"
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="photo">Photo URL</label>
                <input
                    type="text"
                    id="photo"
                    name="photo"
                    required
                >
            </div>

            <button
                type="submit"
                class="submit-btn"
            >
                Submit
            </button>

        </form>

    </div>


    <!-- User Cards -->

    <div class="cards-container">

        
    </div>
<script src="Script.js"></script>
</body>
</html>
